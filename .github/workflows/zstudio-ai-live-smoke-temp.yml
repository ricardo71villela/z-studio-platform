name: Z Studio AI Live Smoke Temp

on:
  push:
    branches:
      - chore/zstudio-ai-live-smoke-temp

permissions:
  contents: read

jobs:
  live-ai-smoke:
    name: Live AI Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify normal production AI request
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
            --request POST 'https://z-studio-platform-seven.vercel.app/api/ai' \
            --header 'Content-Type: application/json' \
            --data '{"system":"Reply with exactly OK.","user":"Health check.","max_tokens":32}')"
          echo "AI_LIVE_HTTP_STATUS=$status"
          cat "$body_file"
          echo
          test "$status" = "200"

      - name: Verify distributed rate limit without AI spend
        shell: bash
        run: |
          set -euo pipefail
          statuses=""
          for i in $(seq 1 13); do
            body_file="$(mktemp)"
            status="$(curl --silent --show-error --output "$body_file" --write-out '%{http_code}' \
              --request POST 'https://z-studio-platform-seven.vercel.app/api/ai' \
              --header 'Content-Type: application/json' \
              --data '{}')"
            body="$(cat "$body_file")"
            echo "REQUEST_${i}_STATUS=$status"
            echo "REQUEST_${i}_BODY=$body"
            statuses="${statuses}${status} "
          done
          echo "WAF_STATUS_SEQUENCE=$statuses"
          echo "$statuses" | grep -q '429'
