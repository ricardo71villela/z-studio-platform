name: Z Studio Release Authority

on:
  push:
    branches:
      - master
      - feature/zstudio-store-readiness-v1
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: zstudio-release-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-contract:
    name: Build Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build generated app
        run: npm run build

      - name: Verify generated artifacts are committed and reproducible
        run: git diff --exit-code -- app/my-studio.html native/www/index.html

  functional-mobile:
    name: Functional + Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Build generated app
        run: npm run build

      - name: Run functional tests
        run: npm test

      - name: Run mobile checks
        run: npm run test:mobile

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Install visual comparison dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build generated app
        run: npm run build

      - name: Run golden visual regression
        run: npm run test:visual
